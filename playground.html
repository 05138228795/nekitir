
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محیط تمرین آنلاین</title>
    <style>
        body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: Tahoma, sans-serif; }
        header { background: #333; color: white; padding: 10px; text-align: center; }
        .container { display: flex; flex: 1; }
        textarea, iframe { width: 50%; height: 100%; border: none; padding: 10px; box-sizing: border-box; }
        textarea { background: #282c34; color: #61dafb; font-family: monospace; font-size: 16px; border-left: 2px solid #555; }
    </style>
</head>
<body>
    <header>محیط تمرین: کد را در سمت راست بنویسید</header>
    <div class="container">
        <textarea id="code" placeholder="کد HTML خود را اینجا پیست کنید..."></textarea>
        <iframe id="preview"></iframe>
    </div>

    <script>
        const textarea = document.getElementById('code');
        const preview = document.getElementById('preview');

        textarea.addEventListener('input', () => {
            const content = textarea.value;
            preview.srcdoc = content;
        });
    </script>
</body>
</html>
